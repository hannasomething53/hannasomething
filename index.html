<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  font-family:sans-serif;
}

/* ===== 전체 가운데 정렬 ===== */
.container{
  width:100%;
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

/* ===== 실제 갤러리 ===== */
/* 2개 이미지 × 900px 기준 */
.gallery{
  width:min(100%, 1840px);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

/* ===== 이미지 ===== */
.gallery img{
  width:100%;
  height:auto;
  display:block;
  cursor:pointer;
}

/* ===== 라이트박스 ===== */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.lightbox.open{
  opacity:1;
  pointer-events:auto;
}

.lightbox img{
  width:min(1200px, 95vw);
  height:auto;
}

.close{
  position:absolute;
  top:30px;
  right:40px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="gallery">

<img src="images/e1.jpg">
<img src="images/e2.jpg">

<img src="images/e3.jpg">
<img src="images/e4.jpg">

<img src="images/e5.jpg">
<img src="images/e6.jpg">

<img src="images/e7.jpg">
<img src="images/e8.jpg">

<img src="images/e9.jpg">
<img src="images/e10.jpg">

<img src="images/e11.jpg">
<img src="images/e12.jpg">

<img src="images/e13.jpg">
<img src="images/e14.jpg">

<img src="images/e15.jpg">
<img src="images/e16.jpg">

<img src="images/e17.jpg">
<img src="images/e18.jpg">

<img src="images/e19.jpg">
<img src="images/e20.jpg">

<img src="images/e21.jpg">
<img src="images/e22.jpg">

</div>
</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
  <span class="close" id="close">&times;</span>
  <img id="lightImg">
</div>

<script>

const box = document.getElementById('lightbox')
const lightImg = document.getElementById('lightImg')
const closeBtn = document.getElementById('close')

document.querySelectorAll('.gallery img').forEach(img=>{
  img.onclick=()=>{
    box.classList.add('open')
    lightImg.src=img.src
  }
})

closeBtn.onclick=()=>box.classList.remove('open')
box.onclick=e=>{
  if(e.target===box) box.classList.remove('open')
}

</script>

</body>
</html>
