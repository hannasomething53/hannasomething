<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>

/* ==========================
   RESET
========================== */
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#faf6e6;
    font-family:'Jost',sans-serif;
    overflow-y:scroll;
}

/* ==========================
   LAYOUT GRID
========================== */
.page{
    display:grid;
    grid-template-columns:
        minmax(220px,18vw)
        minmax(600px,1200px)
        130px;
    gap:0;
    min-height:100vh;
}

/* ==========================
   LEFT NAV
========================== */
.nav{
    padding-top:300px;
    padding-left:30px;
    position:relative;
}

.nav-inner{
    position:sticky;
    top:0;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:20px;
}

.me-img{
    width:100%;
    border-radius:16px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:18px;
    font-size:28px;
    font-weight:400;
    font-style:italic;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.menu-item img{
    height:24px;
}

.email{
    margin-top:10px;
    font-size:18px;
}

.social{
    margin-top:20px;
    display:flex;
    gap:12px;
}

.social img{
    width:55px;
    cursor:pointer;
}

/* ==========================
   GALLERY
========================== */
.gallery{
    padding-top:50px;
    padding-left:30px;
    padding-right:130px;
}

.art{
    margin-bottom:80px;
    opacity:0;
    transform:translateY(80px);
    transition:1s ease;
}

.art.visible{
    opacity:1;
    transform:translateY(0);
}

.caption{
    font-size:20px;
    margin-bottom:4px;
}

.art img{
    width:100%;
    max-width:1200px;
    cursor:pointer;
    transition:.2s;
}

.art img:hover{
    transform:scale(1.03);
}

/* ==========================
   THUMBNAILS
========================== */
.thumbs{
    position:sticky;
    top:50px;
    height:calc(100vh - 50px);
    overflow-y:auto;
    padding-left:130px;
}

.thumbs::-webkit-scrollbar{display:none}

.thumb{
    width:130px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.3s;
}

.thumb:hover{opacity:.7}

/* ==========================
   LIGHTBOX
========================== */
.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.lightbox img{
    max-height:90vh;
}

/* ==========================
   RESPONSIVE SAFETY
========================== */
@media (max-width:1200px){
    .page{
        grid-template-columns:
        minmax(200px,22vw)
        1fr
        130px;
    }
}

@media (max-width:900px){
    .thumbs{display:none}
}

</style>
</head>

<body>

<div class="page">

<!-- ==========================
LEFT NAV
========================== -->
<div class="nav">
<div class="nav-inner">

<img src="me.png" class="me-img">

<div class="menu">
<div class="menu-item"><img src="one.png">Editorial illust</div>
<div class="menu-item"><img src="one.png">Personal works</div>
<div class="menu-item"><img src="one.png">Comics</div>
<div class="menu-item"><img src="one.png">Me</div>
</div>

<div class="email">mybrowncat53@gmail.com</div>

<div class="social">
<a href="https://www.behance.net/hibyhanna3e0f" target="_blank"><img src="bluebeh.png"></a>
<a href="https://www.instagram.com/hanna_something/" target="_blank"><img src="blueins.png"></a>
</div>

</div>
</div>


<!-- ==========================
GALLERY
========================== -->
<div class="gallery" id="gallery">

<div class="art" id="e1">
<div class="caption">Cover of the Sharjah International Book Fair Anthology 2023</div>
<img src="e1.jpg">
</div>

<div class="art" id="e2">
<div class="caption">Interior Pages of the Sharjah International Book Fair Anthology</div>
<img src="e2.jpg">
</div>

<script>
const order=[
'e3','e4','e5','e6','p25','e7','e8','e13','p28','p26','p27','p31','p29','p30','e9','e10','e14','e15','e16','e17','e18','e19','e20','e21','e22','e23','e24','p32','p33','p34'
];
const gallery=document.getElementById('gallery');
order.forEach(id=>{
const wrap=document.createElement('div');
wrap.className='art';
wrap.id=id;
const img=document.createElement('img');
img.src=id+'.jpg';
wrap.appendChild(img);
gallery.appendChild(wrap);
});
</script>

</div>


<!-- ==========================
THUMBNAILS
========================== -->
<div class="thumbs" id="thumbs"></div>

</div>


<!-- ==========================
LIGHTBOX
========================== -->
<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>


<script>

/* ==========================
CREATE THUMBNAILS
========================== */
const thumbs=document.getElementById('thumbs');
const all=[ 'e1','e2', ...order ];

all.forEach(id=>{
const img=document.createElement('img');
img.src='s'+id.replace(/[a-z]/,'')+'.jpg';
img.className='thumb';
img.onclick=()=>{
 document.getElementById(id).scrollIntoView({behavior:'smooth'});
};
thumbs.appendChild(img);
});


/* ==========================
LIGHTBOX
========================== */
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightbox-img');

document.querySelectorAll('.art img').forEach(img=>{
img.onclick=()=>{
lightbox.style.display='flex';
lightboxImg.src=img.src;
};
});

lightbox.onclick=()=>lightbox.style.display='none';

document.addEventListener('keydown',e=>{
if(e.key==='Escape') lightbox.style.display='none';
});


/* ==========================
SCROLL REVEAL
========================== */
const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting) e.target.classList.add('visible');
});
},{threshold:.15});

document.querySelectorAll('.art').forEach(el=>observer.observe(el));


/* ==========================
SYNC THUMB SCROLL
========================== */
const galleryEl=document.getElementById('gallery');
window.addEventListener('scroll',()=>{
const ratio=window.scrollY/(document.body.scrollHeight-window.innerHeight);
thumbs.scrollTop=ratio*(thumbs.scrollHeight-thumbs.clientHeight);
});


/* ==========================
DISABLE RIGHT CLICK
========================== */
document.addEventListener('contextmenu',e=>e.preventDefault());


/* ==========================
CUSTOM CURSOR
========================== */
document.body.style.cursor="url('mouse.png'), auto";

</script>

</body>
</html>
