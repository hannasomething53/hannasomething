<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Playwrite NZ Basic', cursive;
}

/* ===== 중앙 정렬 영역 ===== */
.main{
display:flex;
justify-content:center;
margin-top:20px; /* 상단 여백 */
}

/* ===== 갤러리 ===== */
.gallery{
width:clamp(900px, 60vw, 1400px);
display:flex;
flex-direction:column;
gap:40px;
}

.gallery img{
width:100%;
cursor:zoom-in;
}

/* ===== 왼쪽 네비 ===== */
.left-nav{
position:fixed;
left:40px;
top:50%;
transform:translateY(-50%);
}

.nav-box{
border:1px solid #999;
padding:8px 24px;
font-size:26px;
white-space:nowrap;
}

/* ===== 오른쪽 썸네일 ===== */
.thumbs{
position:fixed;
right:40px;
top:20px;
height:calc(100vh - 40px);
overflow-y:auto;
scrollbar-width:none;
}

.thumbs::-webkit-scrollbar{
display:none;
}

.thumbs img{
width:180px;
display:block;
margin-bottom:12px;
cursor:pointer;
transition:0.25s;
}

.thumbs img:hover{
opacity:0.7;
}

/* ===== 라이트박스 ===== */
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.lightbox img{
max-height:90vh;
max-width:90vw;
}

</style>
</head>

<body>

<!-- 왼쪽 네비 -->
<div class="left-nav">
<div class="nav-box">Editorial illust</div>
<div class="nav-box">personal works</div>
<div class="nav-box">comics</div>
<div class="nav-box">me</div>
</div>

<!-- 중앙 갤러리 -->
<div class="main">
<div class="gallery" id="gallery"></div>
</div>

<!-- 오른쪽 썸네일 -->
<div class="thumbs" id="thumbs"></div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<script>

const gallery=document.getElementById("gallery");
const thumbs=document.getElementById("thumbs");
const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

const total=22;

for(let i=1;i<=total;i++){

const src=`images/e${i}.jpg`;

/* 갤러리 */
const g=document.createElement("img");
g.src=src;
g.id=`img${i}`;
gallery.appendChild(g);

g.onclick=()=>{
lightbox.style.display="flex";
lightboxImg.src=src;
};

/* 썸네일 */
const t=document.createElement("img");
t.src=src;
thumbs.appendChild(t);

t.onclick=()=>{
document.getElementById(`img${i}`)
.scrollIntoView({behavior:"smooth", block:"center"});
};

}

/* 라이트박스 닫기 */
lightbox.onclick=()=>lightbox.style.display="none";

document.addEventListener("keydown",e=>{
if(e.key==="Escape") lightbox.style.display="none";
});

</script>

</body>
</html>
