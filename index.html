<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic&display=swap" rel="stylesheet">

<style>

/* =========================
기본
========================= */

body{
margin:0;
background:white;
font-family:'Playwrite NZ Basic', sans-serif;
padding-top:50px;
}

img{
display:block;
max-width:100%;
}

a{
text-decoration:none;
color:inherit;
}

/* =========================
전체 레이아웃
========================= */

.wrapper{
display:flex;
justify-content:center;
align-items:flex-start;
}

/* =========================
왼쪽 정보 패널
========================= */

.leftPanel{
display:flex;
align-items:flex-start;
margin-right:20px;
position:sticky;
top:50px;
}

/* 세로 라인 */
.verticalLine{
width:5px;
background:#d7d7d7;
height:100vh;
margin-right:25px;
}

/* 텍스트 영역 */
.leftContent{
font-size:35px;
color:#d7d7d7;
line-height:1.9;
}

/* 카테고리 줄 */
.cat{
display:flex;
align-items:center;
gap:15px;
}

/* 원 */
.dot{
width:14px;
height:14px;
background:#d7d7d7;
border-radius:50%;
}

/* 이메일 */
.email{
margin-top:20px;
font-size:24px;
}

/* SNS */
.sns{
margin-top:30px;
display:flex;
gap:20px;
}

.sns img{
width:50px;
height:50px;
cursor:pointer;
}

/* =========================
갤러리
========================= */

.gallery{
width:clamp(500px,60vw,900px);
margin-right:100px;
}

.art{
margin-bottom:80px;
cursor:zoom-in;
opacity:0;
transform:translateY(80px);
transition:0.6s ease;
}

.art.show{
opacity:1;
transform:translateY(0);
}

/* =========================
썸네일
========================= */

.thumbWrap{
position:sticky;
top:50px;
height:calc(100vh - 60px);
overflow-y:auto;
scrollbar-width:none;
}

.thumbWrap::-webkit-scrollbar{
display:none;
}

.thumb{
width:180px;
margin-bottom:6px;
cursor:pointer;
transition:0.25s;
}

.thumb:hover{
opacity:0.7;
}

/* =========================
라이트박스
========================= */

#viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
padding:4vh 4vw;
box-sizing:border-box;
}

#viewer img{
max-height:92vh;
max-width:92vw;
object-fit:contain;
}

</style>
</head>

<body>

<div class="wrapper">

<!-- =====================
왼쪽 정보 패널
===================== -->

<div class="leftPanel">

<div class="verticalLine"></div>

<div class="leftContent">

<div class="cat"><div class="dot"></div>Editorial illust</div>
<div class="cat"><div class="dot"></div>Personal works</div>
<div class="cat"><div class="dot"></div>Comix</div>
<div class="cat"><div class="dot"></div>Me</div>

<div class="email">
mybrowncat53@gmail.com
</div>

<div class="sns">
<a href="https://www.behance.net/hibyhanna3e0f" target="_blank">
<img src="images/beh.png">
</a>
<a href="https://www.instagram.com/hanna_something/" target="_blank">
<img src="images/ins.png">
</a>
</div>

</div>
</div>

<!-- =====================
갤러리
===================== -->

<main class="gallery" id="gallery"></main>

<!-- =====================
썸네일
===================== -->

<aside class="thumbWrap" id="thumbWrap"></aside>

</div>

<!-- 라이트박스 -->
<div id="viewer">
<img id="viewerImg">
</div>

<script>

/* 이미지 순서 */
const files = [
"e1","e2","e3","e4","e5","e6","p25","e7","e8","e13",
"p28","p26","p27","p31","p29","p30",
"e9","e10","e14","e15","e16","e17","e18","e19",
"e20","e21","e22","e23","e24","p32","e33","e34"
];

const gallery = document.getElementById("gallery");
const thumbWrap = document.getElementById("thumbWrap");

/* 이미지 생성 */
files.forEach(name=>{

const img=document.createElement("img");
img.src="images/"+name+".jpg";
img.className="art";
img.id=name;
gallery.appendChild(img);

const num=name.replace(/[a-z]/g,'');
const thumb=document.createElement("img");
thumb.src="images/s"+num+".jpg";
thumb.className="thumb";

thumb.onclick=()=>{
document.getElementById(name).scrollIntoView({
behavior:'smooth',
block:'center'
});
};

thumbWrap.appendChild(thumb);
});

/* 스크롤 등장 */
const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting) e.target.classList.add("show");
});
});

document.querySelectorAll(".art").forEach(img=>{
observer.observe(img);
});

/* 라이트박스 */
const viewer=document.getElementById("viewer");
const viewerImg=document.getElementById("viewerImg");

document.querySelectorAll(".art").forEach(img=>{
img.onclick=()=>{
viewer.style.display="flex";
viewerImg.src=img.src;
};
});

viewer.onclick=()=>viewer.style.display="none";

document.addEventListener("keydown",e=>{
if(e.key==="Escape") viewer.style.display="none";
});

</script>

</body>
</html>
