<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>

/* =========================
기본 설정
========================= */

body{
margin:0;
background:#faf6e6;
font-family:'Jost', sans-serif;
cursor:url("images/mouse.png"), auto;
}

.wrapper{
display:flex;
justify-content:center;
gap:clamp(30px,5vw,130px);
padding-top:50px;
align-items:flex-start;
}

/* =========================
왼쪽 네비
========================= */

.nav{
position:sticky;
top:300px;
width:clamp(160px,15vw,260px);
margin-right:30px;
text-align:left;
}

.nav img.top{
width:100%;
margin-bottom:20px;
}

.nav-item{
display:flex;
align-items:center;
gap:10px;
font-size:28px;
font-style:italic;
margin:8px 0;
}

.nav-item img{
width:18px;
}

.email{
margin-top:15px;
font-size:22px;
}

.sns{
margin-top:10px;
}

.sns img{
width:55px;
margin-right:10px;
}

/* =========================
갤러리
========================= */

.gallery{
width:min(1200px,60vw);
}

.art{
margin-bottom:80px;
opacity:0;
transform:translateY(40px);
transition:.6s;
}

.art.show{
opacity:1;
transform:none;
}

.caption{
font-size:20px;
margin-bottom:5px;
}

.art img{
width:100%;
cursor:zoom-in;
}

/* =========================
오른쪽 썸네일
========================= */

.thumbs{
position:sticky;
top:50px;
height:calc(100vh - 50px);
overflow:auto;
scrollbar-width:none;
}

.thumbs::-webkit-scrollbar{
display:none;
}

.thumbs img{
display:block;
width:130px;
margin-bottom:10px;
cursor:pointer;
transition:.2s;
}

.thumbs img:hover{
opacity:.7;
}

/* =========================
라이트박스
========================= */

#lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

#lightbox img{
max-height:92vh;
max-width:92vw;
}

/* =========================
반응형 겹침 방지
========================= */

@media (max-width:1100px){
.wrapper{
gap:30px;
}
.gallery{
width:55vw;
}
.thumbs img{
width:100px;
}
}

</style>
</head>

<body>


<div class="wrapper">

<!-- 왼쪽 네비 -->
<div class="nav">

<img src="images/me.png" class="top">

<div class="nav-item"><img src="images/one.png">Editorial illust</div>
<div class="nav-item"><img src="images/one.png">Personal works</div>
<div class="nav-item"><img src="images/one.png">Comics</div>
<div class="nav-item"><img src="images/one.png">Me</div>

<div class="email">mybrowncat53@gmail.com</div>

<div class="sns">
<a href="https://www.behance.net/hibyhanna3e0f" target="_blank">
<img src="images/bluebeh.png">
</a>

<a href="https://www.instagram.com/hanna_something/" target="_blank">
<img src="images/blueins.png">
</a>
</div>

</div>



<!-- 갤러리 -->
<div class="gallery" id="gallery"></div>



<!-- 썸네일 -->
<div class="thumbs" id="thumbs"></div>

</div>



<!-- 라이트박스 -->
<div id="lightbox">
<img id="lightbox-img">
</div>



<script>

/* ======================
이미지 순서
====================== */

const order=[
"e1","e2","e3","e4","e5","e6",
"p25","e7","e8","e13",
"p28","p26","p27","p31","p29","p30",
"e9","e10","e14","e15","e16","e17",
"e18","e19","e20","e21","e22","e23","e24",
"p32","p33","p34"
];


/* ======================
설명 텍스트
====================== */

const captions={
e1:"Cover of the Sharjah International Book Fair Anthology 2023",
e2:"Interior Pages of the Sharjah International Book Fair Anthology"
};


/* ======================
갤러리 생성
====================== */

const gallery=document.getElementById("gallery");

order.forEach(name=>{

const wrap=document.createElement("div");
wrap.className="art";

if(captions[name]){
const cap=document.createElement("div");
cap.className="caption";
cap.textContent=captions[name];
wrap.appendChild(cap);
}

const img=document.createElement("img");
img.src="images/"+name+".jpg";
img.id=name;

wrap.appendChild(img);
gallery.appendChild(wrap);

});


/* ======================
썸네일 생성
====================== */

const thumbs=document.getElementById("thumbs");

order.forEach(name=>{

const num=name.replace(/[a-z]/g,"");

const img=document.createElement("img");
img.src="images/s"+num+".jpg";

img.onclick=()=>{
document.getElementById(name)
.scrollIntoView({behavior:"smooth",block:"center"});
};

thumbs.appendChild(img);

});


/* ======================
라이트박스
====================== */

const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

document.addEventListener("click",e=>{
if(e.target.closest(".gallery img")){
lightbox.style.display="flex";
lightboxImg.src=e.target.src;
}
});

lightbox.onclick=()=>lightbox.style.display="none";

document.addEventListener("keydown",e=>{
if(e.key==="Escape") lightbox.style.display="none";
});


/* ======================
등장 애니메이션
====================== */

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting) entry.target.classList.add("show");
});
},{threshold:0.1});

document.querySelectorAll(".art").forEach(el=>observer.observe(el));


/* ======================
썸네일 자동 동기화
====================== */

let current=null;

function sync(){

let closest=null;
let min=Infinity;

order.forEach(name=>{
const el=document.getElementById(name);
const d=Math.abs(el.getBoundingClientRect().top);
if(d<min){min=d;closest=name;}
});

if(closest===current) return;
current=closest;

const num=closest.replace(/[a-z]/g,"");

const target=[...thumbs.children]
.find(t=>t.src.includes("s"+num));

if(target){
target.scrollIntoView({block:"center"});
}

}

window.addEventListener("scroll",sync,{passive:true});


/* ======================
우클릭 방지
====================== */

document.addEventListener("contextmenu",e=>{
if(e.target.tagName==="IMG") e.preventDefault();
});

</script>

</body>
</html>
