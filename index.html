<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<title>Gallery</title>

<style>

/* =========================
전체 배경
========================= */
body{
margin:0;
background:#faf6e6;
font-family:'Jost', sans-serif;
overflow-x:hidden;
}

/* =========================
전체 레이아웃
========================= */
.wrapper{
display:flex;
justify-content:center;
align-items:flex-start;
gap:40px;
padding-top:50px;
}

/* =========================
왼쪽 네비게이션
========================= */
.left-nav{
position:sticky;
top:400px;
width:clamp(160px,15vw,260px);
flex-shrink:0;
text-align:left;
margin-right:30px;
}

.left-nav img.flower{
width:100%;
margin-bottom:20px;
}

.nav-item{
display:flex;
align-items:center;
gap:8px;
font-size:28px;
font-style:italic;
margin:10px 0;
}

.nav-item img{
height:20px;
}

.email{
margin-top:20px;
font-size:20px;
}

.sns{
margin-top:10px;
display:flex;
gap:12px;
}

.sns img{
width:40px;
cursor:pointer;
}

/* =========================
갤러리
========================= */
.gallery{
width:clamp(500px,60vw,1200px);
}

.art-block{
margin-bottom:60px;
opacity:0;
transform:translateY(40px);
transition:all 0.6s ease;
}

.art-block.show{
opacity:1;
transform:translateY(0);
}

.caption{
font-size:20px;
margin-bottom:8px;
}

.gallery img{
width:100%;
display:block;
cursor:zoom-in;
}

/* =========================
라이트박스
========================= */
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-height:92vh;
max-width:92vw;
}

/* =========================
오른쪽 썸네일
========================= */
.thumbs{
position:sticky;
top:50px;
height:calc(100vh - 50px);
margin-left:130px;

/* 스크롤 가능 */
overflow-y:auto;

/* 스크롤바 숨김 */
scrollbar-width:none;
-ms-overflow-style:none;
}
.thumbs::-webkit-scrollbar{
display:none;
}

.thumb-list{
display:flex;
flex-direction:column;
gap:30px;
}

.thumbs img{
width:130px;
cursor:pointer;
transition:0.2s;
}

.thumbs img:hover{
opacity:0.7;
}

/* =========================
반응형
========================= */
@media (max-width:1100px){
.wrapper{
flex-direction:column;
align-items:center;
}
.left-nav{
position:relative;
top:auto;
margin-right:0;
margin-bottom:30px;
}
.thumbs{
position:relative;
height:auto;
margin-left:0;
margin-top:40px;
}
}

</style>
</head>

<body oncontextmenu="return false">

<div class="wrapper">

<div class="left-nav">
<img src="images/flower.png" class="flower">
<div class="nav-item"><img src="images/ong.png">Editorial illust</div>
<div class="nav-item"><img src="images/ong.png">Personal works</div>
<div class="nav-item"><img src="images/ong.png">Comics</div>
<div class="nav-item"><img src="images/ong.png">Me</div>
<div class="email">mybrowncat53@gmail.com</div>
<div class="sns">
<a href="https://www.behance.net/hibyhanna3e0f" target="_blank">
<img src="images/bluebeh.png">
</a>
<a href="https://www.instagram.com/hanna_something/" target="_blank">
<img src="images/blueins.png">
</a>
</div>
</div>

<div class="gallery" id="gallery"></div>

<div class="thumbs">
<div class="thumb-list" id="thumbList"></div>
</div>

</div>

<div class="lightbox" id="lightbox">
<img id="lightboxImg">
</div>

<script>

/* 이미지 순서 */
const order=[
"e1","e2","e3","e4","e5","e6","p25","e7","e8","e13",
"p28","p26","p27","p31","p29","p30","e9","e10",
"e14","e15","e16","e17","e18","e19","e20",
"e21","e22","e23","e24","p32","p33","p34"
];

/* 캡션 */
const captions={
e1:"Cover of the Sharjah International Book Fair Anthology 2023",
e2:"Interior Pages of the Sharjah International Book Fair Anthology"
};

const gallery=document.getElementById("gallery");

order.forEach(name=>{
const block=document.createElement("div");
block.className="art-block";
block.id=name;

const cap=document.createElement("div");
cap.className="caption";
cap.innerText=captions[name]||"";

const img=document.createElement("img");
img.src=`images/${name}.jpg`;

img.onclick=()=>{
lightbox.style.display="flex";
lightboxImg.src=img.src;
};

block.appendChild(cap);
block.appendChild(img);
gallery.appendChild(block);
});

/* 등장 애니메이션 */
const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting) e.target.classList.add("show");
});
},{threshold:0.2});

document.querySelectorAll(".art-block").forEach(el=>observer.observe(el));

/* 라이트박스 */
const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightboxImg");

lightbox.onclick=()=>lightbox.style.display="none";
document.addEventListener("keydown",e=>{
if(e.key==="Escape") lightbox.style.display="none";
});

/* 썸네일 생성 */
const thumbList=document.getElementById("thumbList");

order.forEach(name=>{
const num=name.replace(/[a-z]/g,"");
const t=document.createElement("img");
t.src=`images/s${num}.jpg`;

t.onclick=()=>{
document.getElementById(name).scrollIntoView({
behavior:"smooth",
block:"start"
});
};

thumbList.appendChild(t);
});

/* 스크롤 동기화 */
window.addEventListener("scroll",()=>{
let closest=null;
let min=999999;

order.forEach(name=>{
const el=document.getElementById(name);
const rect=el.getBoundingClientRect();
const dist=Math.abs(rect.top);

if(dist<min){
min=dist;
closest=name;
}
});

if(closest){
const num=closest.replace(/[a-z]/g,"");
const thumbs=[...thumbList.children];
const target=thumbs.find(t=>t.src.includes(`s${num}`));
if(target){
target.scrollIntoView({
block:"center",
behavior:"smooth"
});
}
}
});

</script>
</body>
</html>
