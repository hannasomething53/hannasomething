<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hanna_something</title>

  <!-- tab icon -->
  <link rel="icon" href="home.png" />
  <link rel="apple-touch-icon" href="home.png" />

  <!-- share 대표 이미지 = 갤러리 첫 이미지 -->
  <meta property="og:title" content="hanna_something" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="e1.jpeg" />

  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 모바일 햄버거 -->
  <button class="m-ham" id="mHam" aria-label="menu">
    <span></span><span></span><span></span>
  </button>

  <!-- 모바일 메뉴 오버레이 -->
  <div class="m-menu" id="mMenu" aria-hidden="true">
    <div class="m-menu-bg" data-act="mClose"></div>
    <div class="m-menu-card" role="dialog" aria-modal="true">
      <button class="m-menu-x" data-act="mClose" aria-label="close">×</button>

      <div class="m-menu-items">
        <button class="m-item" data-act="openMe">Me</button>
        <button class="m-item email" data-act="copyEmail">mybrowncat53@gmail.com</button>

        <div class="m-icons">
          <a href="https://www.behance.net/hibyhanna3e0f" target="_blank" rel="noopener" class="m-icon">
            <img src="linebeh.png" alt="Behance" />
          </a>
          <a href="https://www.instagram.com/hanna_something/" target="_blank" rel="noopener" class="m-icon">
            <img src="lineins.png" alt="Instagram" />
          </a>
        </div>

        <div class="m-hr"></div>

        <div class="m-sub">Comics</div>
        <div class="m-comics" id="mComics"></div>

        <div class="m-hint">Tap anywhere to close</div>
      </div>
    </div>
  </div>

  <!-- 데스크탑 3열 -->
  <div class="wrap">

    <!-- LEFT: Category (sticky) -->
    <aside class="col-left">
      <div class="cat-fixed">
        <!-- 250px 아래부터 시작 -->
        <div class="cat-spacer"></div>

        <!-- home 버튼 (one.png ~ Editorial 길이 중간 느낌으로 위쪽에 배치) -->
        <button class="homebtn" data-act="goHome" aria-label="home">
          <img src="home.png" alt="home" />
        </button>

        <nav class="cat">
          <button class="catrow" data-act="openViewer" data-kind="editorial">
            <img src="one.png" class="bullet" alt="" />
            <span class="txt">Editorial illust</span>
          </button>

          <button class="catrow" data-act="openViewer" data-kind="personal">
            <img src="one.png" class="bullet" alt="" />
            <span class="txt nowrap">Personal works</span>
          </button>

          <button class="catrow" data-act="openComics">
            <img src="one.png" class="bullet" alt="" />
            <span class="txt">Comics</span>
          </button>

          <button class="catrow" data-act="openMe">
            <img src="one.png" class="bullet" alt="" />
            <span class="txt">Me</span>
          </button>

          <button class="catrow email" data-act="copyEmail">
            <span class="txt">mybrowncat53@gmail.com</span>
          </button>

          <div class="caticons">
            <a class="iconlink" href="https://www.behance.net/hibyhanna3e0f" target="_blank" rel="noopener">
              <img src="linebeh.png" alt="Behance" />
            </a>
            <a class="iconlink" href="https://www.instagram.com/hanna_something/" target="_blank" rel="noopener">
              <img src="lineins.png" alt="Instagram" />
            </a>
          </div>
        </nav>
      </div>
    </aside>

    <!-- CENTER: Gallery -->
    <main class="col-mid">
      <div class="gallery" id="gallery"></div>

      <!-- Comics page(센터/오른쪽을 교체하는 영역) -->
      <div class="comicsPage" id="comicsPage" aria-hidden="true">
        <div class="comicsList" id="comicsList"></div>
      </div>
    </main>

    <!-- RIGHT: Thumbnail rail -->
    <aside class="col-right">
      <div class="thumbRail" id="thumbRail"></div>
    </aside>
  </div>

  <!-- Gallery Lightbox -->
  <div class="lb" id="lb" aria-hidden="true">
    <div class="lb-bg" data-act="lbClose"></div>
    <img class="lb-img" id="lbImg" alt="" />
  </div>

  <!-- Editorial/Personal Viewer -->
  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer-bg" data-act="vClose"></div>

    <button class="v-x" data-act="vClose" aria-label="close">×</button>
    <button class="v-arrow left" data-act="vPrev" aria-label="prev">‹</button>
    <button class="v-arrow right" data-act="vNext" aria-label="next">›</button>

    <!-- 여백 클릭 이동 -->
    <div class="v-zone left" data-act="vPrev" aria-hidden="true"></div>
    <div class="v-zone right" data-act="vNext" aria-hidden="true"></div>

    <div class="v-stage">
      <img class="v-img" id="vImg" alt="" />
      <div class="v-cap" id="vCap"></div>
    </div>

    <div class="v-thWrap">
      <div class="v-th" id="vThumbs"></div>
    </div>
  </div>

  <!-- Comics Book viewer -->
  <div class="book" id="book" aria-hidden="true">
    <div class="book-bg" data-act="bClose"></div>

    <button class="b-x" data-act="bClose" aria-label="close">×</button>
    <button class="b-arrow left" data-act="bPrev" aria-label="prev">‹</button>
    <button class="b-arrow right" data-act="bNext" aria-label="next">›</button>

    <div class="b-zone left" data-act="bPrev" aria-hidden="true"></div>
    <div class="b-zone right" data-act="bNext" aria-hidden="true"></div>

    <div class="b-stage">
      <img class="b-img" id="bImg" alt="" />
    </div>
  </div>

  <!-- Me modal -->
  <div class="me" id="me" aria-hidden="true">
    <div class="me-bg" data-act="meClose"></div>

    <div class="me-card" role="dialog" aria-modal="true">
      <button class="me-x" data-act="meClose" aria-label="close">×</button>

      <div class="me-scroll">
        <div class="me-stage" id="meStage">
          <img src="memyme.jpeg" id="meImg" alt="me" />

          <a class="hit insta" href="https://www.instagram.com/hanna_something/" target="_blank" rel="noopener" aria-label="instagram"></a>
          <a class="hit itsnice" href="https://www.itsnicethat.com/articles/hanna-something-illustration-020920" target="_blank" rel="noopener" aria-label="itsnicethat"></a>
          <a class="hit behance" href="https://www.behance.net/hibyhanna3e0f" target="_blank" rel="noopener" aria-label="behance"></a>
          <button class="hit emailcopy" data-act="copyEmail" aria-label="copy email"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
