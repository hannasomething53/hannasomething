<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>

<style>

/* ===== 전체 ===== */
body{
  margin:0;
  display:flex;
  background:#eef2f3;
  font-family:Arial, sans-serif;
}


/* ===== 왼쪽 네비 ===== */
.sidebar{
  width:400px;
  height:100vh;
  background:#d9d9d9;
  padding:60px 40px;
  box-sizing:border-box;
  position:sticky;
  top:0;

  transform:translateX(100%);
  animation:slideIn 0.6s ease forwards;
}

@keyframes slideIn{
  to{ transform:translateX(0); }
}


/* ===== 갤러리 영역 ===== */
.gallery{
  flex:1;
  padding:40px;
}


/* ===== 2열 고정 그리드 ===== */
.grid{
  display:grid;

  /* 핵심 */
  grid-template-columns:repeat(2, 1fr);

  gap:40px;
}


/* ===== 이미지 ===== */
.grid img{

  /* 핵심 */
  width:min(900px, 100%);

  height:auto;
  display:block;
  margin:auto;
  cursor:pointer;
}


/* ===== 라이트박스 ===== */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}


/* 확대 이미지 */
#lightbox img{

  /* 핵심 확대 규칙 */
  width:min(1200px, 92vw);
  height:auto;

  display:block;
}

</style>
</head>


<body>

<!-- 왼쪽 네비 -->
<div class="sidebar">
  <p>Editorial illust</p>
  <p>Personal works</p>
  <p>Narrative / comics</p>
  <p>Me</p>
</div>


<!-- 이미지 영역 -->
<div class="gallery">
  <div class="grid" id="grid"></div>
</div>


<!-- 라이트박스 -->
<div id="lightbox">
  <img id="lightbox-img">
</div>



<script>

/* ===== 이미지 자동 생성 ===== */

const grid=document.getElementById("grid");

for(let i=1;i<=22;i++){
  const img=document.createElement("img");
  img.src=`images/e${i}.jpg`;
  grid.appendChild(img);
}


/* ===== 라이트박스 ===== */

const lightbox=document.getElementById("lightbox");
const lightImg=document.getElementById("lightbox-img");

document.addEventListener("click",e=>{
  if(e.target.closest(".grid img")){
    lightImg.src=e.target.src;
    lightbox.style.display="flex";
  }
});

lightbox.onclick=()=>{
  lightbox.style.display="none";
};

</script>

</body>
</html>
