<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Offside&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  background:#ffffff;
  font-family:'Offside',sans-serif;
}

/* ==============================
LAYOUT
============================== */

.wrapper{
  width:100%;
  min-height:100vh;
  display:flex;
}

/* ==============================
LEFT NAV BAR
============================== */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:30px;
  height:100vh;
  background:#d7d7d7;
  transform:translateX(-100%);
  animation:slideIn 1s ease forwards;
  z-index:1000;
}

@keyframes slideIn{
  to{transform:translateX(0);} 
}

.nav-inner{
  position:fixed;
  left:15px;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  gap:24px;
  font-size:24px;
}

.nav-inner a{
  text-decoration:none;
  color:black;
  transition:all 0.3s ease;
}

.nav-inner a:hover{
  font-size:40px;
  animation:blink 0.4s infinite alternate;
}

@keyframes blink{
  from{color:black;}
  to{color:white;background:black;}
}

/* ==============================
GALLERY AREA
============================== */

.gallery-area{
  margin-left:30px;
  width:100%;
  display:flex;
  justify-content:center;
}

.gallery-wrapper{
  width:100%;
  max-width:1560px;
  padding:40px 20px;
}

/* masonry 3 column */
.gallery{
  column-count:3;
  column-gap:10px;
}

.gallery img{
  width:100%;
  max-width:500px;
  margin-bottom:10px;
  cursor:pointer;
  opacity:0.4;
  transform:scale(1);
  transition:
    transform 0.3s ease,
    opacity 0.8s ease;
  break-inside:avoid;
}

.gallery img.visible{
  opacity:1;
}

.gallery img:hover{
  transform:scale(1.3);
  z-index:10;
}

/* ==============================
LIGHTBOX
============================== */

.lightbox{
  position:fixed;
  left:0;
  top:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.4s ease;
  z-index:2000;
}

.lightbox.active{
  opacity:1;
  pointer-events:auto;
}

.lightbox img{
  width:90vw;
  max-width:1200px;
  height:auto;
}

</style>
</head>

<body>

<div class="sidebar"></div>

<div class="nav-inner">
  <a href="#e1">Editorial illust</a>
  <a href="#">personal works</a>
  <a href="#">comics</a>
  <a href="#">me</a>
</div>

<div class="wrapper">

<div class="gallery-area">
<div class="gallery-wrapper">

<div class="gallery" id="gallery">

<img id="e1" src="images/e1.jpg">
<img src="images/e2.jpg">
<img src="images/e3.jpg">
<img src="images/e4.jpg">
<img src="images/e5.jpg">
<img src="images/e6.jpg">
<img src="images/e7.jpg">
<img src="images/e8.jpg">
<img src="images/e9.jpg">
<img src="images/e10.jpg">
<img src="images/e11.jpg">
<img src="images/e12.jpg">
<img src="images/e13.jpg">
<img src="images/e14.jpg">
<img src="images/e15.jpg">
<img src="images/e16.jpg">
<img src="images/e17.jpg">
<img src="images/e18.jpg">
<img src="images/e19.jpg">
<img src="images/e20.jpg">
<img src="images/e21.jpg">
<img src="images/e22.jpg">

</div>

</div>
</div>

</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<script>

/* ==============================
SCROLL FADE IN
============================== */

const images = document.querySelectorAll('.gallery img');

const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
    }
  });
},{threshold:0.2});

images.forEach(img=>observer.observe(img));


/* ==============================
LIGHTBOX
============================== */

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img=>{
  img.addEventListener('click',()=>{
    lightbox.classList.add('active');
    lightboxImg.src = img.src;
  });
});

lightbox.addEventListener('click',()=>{
  lightbox.classList.remove('active');
});

</script>

</body>
</html>
