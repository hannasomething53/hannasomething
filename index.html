<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@1,400&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#fffff4;
    font-family:'Jost', sans-serif;
    cursor:url('images/mouse.png'), auto;
}

/* 우클릭 방지 */
img{
    user-select:none;
    -webkit-user-drag:none;
}

/* ===== 전체 중앙 배치 ===== */

.wrapper{
    display:flex;
    justify-content:center; /* 갤러리 중심 */
    align-items:flex-start;
    gap:clamp(10px,3vw,100px);
    padding:0 20px;
}

/* ===== 왼쪽 네비 ===== */

.left-nav{
    margin-top:200px;
    flex:0 1 220px;
}

.left-nav li{
    font-size:26px;
    font-style:italic;
    margin-bottom:10px;
}

/* ===== 갤러리 ===== */

.gallery{
    margin-top:50px;
    width:1000px;
    max-width:60vw;
}

.gallery-item{
    margin-bottom:70px;
}

.gallery img{
    width:100%;
}

/* ===== 오른쪽 썸네일 ===== */

.thumbnails{
    margin-top:50px;
    width:130px;
    max-height:90vh;
    overflow-y:auto;
}

.thumbnails::-webkit-scrollbar{ display:none; }
.thumbnails{ scrollbar-width:none; }

.thumb{
    width:130px;
    margin-bottom:50px;
    cursor:pointer;
}

.thumb:hover{
    opacity:0.7;
}

/* ===== 라이트박스 ===== */

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
}

.lightbox img{
    max-height:92vh;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="left-nav">
<ul>
<li>Editorial illust</li>
<li>Personal works</li>
<li>Comics</li>
<li>Me</li>
</ul>
</div>

<div class="gallery" id="gallery"></div>

<div class="thumbnails" id="thumbs"></div>

</div>

<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>


<script>

/* 이미지 순서 */
const order=[
"e1","e2","e3","e4","e5","e6","p25","e7","e8","e13","p28","p26","p27","p31",
"p29","p30","e9","e10","e14","e15","e16","e17","e18","e19","e20","e21","e22",
"e23","e24","p32","p33","p34"
];

const gallery=document.getElementById('gallery');
const thumbs=document.getElementById('thumbs');

/* 생성 */
order.forEach(name=>{

    const num=name.replace(/[a-z]/g,'');

    const wrap=document.createElement('div');
    wrap.className='gallery-item';
    wrap.id=name;

    const img=document.createElement('img');
    img.src=`images/${name}.jpg`;
    wrap.appendChild(img);

    gallery.appendChild(wrap);

    const t=document.createElement('img');
    t.src=`images/s${num}.jpg`;
    t.className='thumb';
    t.dataset.target=name;
    thumbs.appendChild(t);
});

/* 라이트박스 */
const lightbox=document.getElementById('lightbox');
const lightImg=document.getElementById('lightbox-img');

gallery.onclick=e=>{
    if(e.target.tagName==="IMG"){
        lightImg.src=e.target.src;
        lightbox.style.display="flex";
    }
};

lightbox.onclick=()=>lightbox.style.display="none";

/* ===== 썸네일 클릭 이동 (확실히 작동) ===== */

thumbs.addEventListener('click',e=>{
    if(!e.target.classList.contains('thumb')) return;

    const id=e.target.dataset.target;
    const target=document.getElementById(id);

    window.scrollTo({
        top:target.getBoundingClientRect().top + window.scrollY - 40,
        behavior:"smooth"
    });
});

/* ===== 스크롤 동기화 ===== */

const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            const id=entry.target.id;
            const thumb=document.querySelector(`.thumb[data-target="${id}"]`);
            if(thumb){
                thumb.scrollIntoView({block:'center',behavior:'smooth'});
            }
        }
    });
},{rootMargin:"-45% 0px -45% 0px"});

document.querySelectorAll('.gallery-item').forEach(el=>observer.observe(el));

/* 우클릭 방지 */
document.addEventListener('contextmenu',e=>e.preventDefault());

</script>

</body>
</html>
