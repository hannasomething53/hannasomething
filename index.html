<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Gallery</title>

<style>

/* 전체 레이아웃 */
body{
    margin:0;
    overflow:hidden;
    font-family: Arial, sans-serif;
    display:flex;
    height:100vh;
}

/* 왼쪽 네비 */
nav{
    width:220px;
    background:#f5f5f5;
    padding:20px;
    box-sizing:border-box;
}

/* 상단 프로필 이미지 */
.profile{
    width:100%;
    margin-bottom:20px;
}

.profile img{
    width:100%;
}

/* 이메일 */
.email{
    font-size:16px; /* 2px 증가 */
    margin-top:10px;
}

/* sns */
.sns img{
    width:50px;
    margin-right:8px;
}

/* 갤러리 영역 */
.gallery-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* 갤러리 타이틀 */
.gallery-title{
    font-size:25px; /* 5px 증가 */
    padding:15px;
}

/* 실제 갤러리 스크롤 영역 */
.gallery{
    flex:1;
    overflow-y:auto;
    padding:30px; /* 갤러리 여백 30px */
    box-sizing:border-box;
}

/* 메인 이미지 */
.main-image{
    width:100%;
    max-width:900px;
    display:block;
    margin-bottom:20px;
}

/* 썸네일 영역 */
.thumbnails{
    position:fixed;
    right:0;
    top:50px;
    bottom:0;
    width:120px;
    overflow-y:auto;
}

.thumbnails img{
    width:100%;
    cursor:pointer;
    margin-bottom:10px;
}

/* 확대 아이콘 */
.zoom-icon{
    position:absolute;
    width:80px; /* dod.png 20% 감소 가정 */
    display:none;
    pointer-events:none;
}

</style>
</head>

<body>

<nav>

<div class="profile">
<img src="me.png">
</div>

<div class="email">example@email.com</div>

<div class="sns">
<img src="linebhe.png">
<img src="lineins.png">
</div>

</nav>


<div class="gallery-wrap">

<div class="gallery-title">Gallery</div>

<div class="gallery" id="gallery">

<img id="mainImage" class="main-image" src="img1.jpg">

</div>

</div>


<div class="thumbnails" id="thumbs">

<img src="img1.jpg">
<img src="img2.jpg">
<img src="img3.jpg">
<img src="img4.jpg">

</div>


<img src="dod.png" class="zoom-icon" id="zoomIcon">

<script src="script.js"></script>

</body>
</html>
