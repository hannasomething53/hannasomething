<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">


<style>

/* ================= 기본 ================= */

body{
margin:0;
font-family:'Space Grotesk', sans-serif;
padding-top:50px;
}


img{
display:block;
max-width:100%;
}

a{
text-decoration:none;
color:inherit;
}

/* ================= 전체 레이아웃 ================= */

.wrapper{
display:flex;
justify-content:center;
align-items:flex-start;
}

/* ================= 왼쪽 네비 ================= */

.leftPanel{
margin-right:20px;
position:sticky;
top:0;
}

.leftContent{
margin-top:400px;
font-size:35px;
color:black;
line-height:1.9;
}

.cat{
margin-bottom:10px;
}

/* Me 박스 */

.meBox{
border:5px solid #d7d7d7;
background:#d7d7d7;
padding:20px;
margin-top:20px;
width:max-content;
border-radius:22px;
}


.email{
font-size:22px;
margin-top:10px;
}

.sns{
margin-top:15px;
display:flex;
gap:15px;
}

.sns img{
width:50px;
cursor:pointer;
}

/* ================= 갤러리 ================= */

.gallery{
width:clamp(500px,60vw,1200px);
margin-right:100px;
}

.art{
margin-bottom:80px;
cursor:zoom-in;
opacity:0;
transform:translateY(80px);
transition:0.6s ease;
}

.art.show{
opacity:1;
transform:translateY(0);
}

/* ================= 썸네일 ================= */

.thumbWrap{
position:sticky;
top:20px;
height:calc(100vh - 40px);
overflow-y:auto;
scrollbar-width:none;
}

.thumbWrap::-webkit-scrollbar{
display:none;
}

.thumb{
width:180px;
margin-bottom:5px;
cursor:pointer;
transition:0.25s;
}

.thumb:hover{
opacity:0.7;
}

/* ================= 라이트박스 ================= */

#viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
padding:4vh 4vw;
}

#viewer img{
max-height:92vh;
max-width:92vw;
object-fit:contain;
}

</style>
</head>

<body>

<div class="wrapper">

<!-- 왼쪽 네비 -->
<div class="leftPanel">
<div class="leftContent">

<div class="cat">Editorial illust</div>
<div class="cat">Personal works</div>
<div class="cat">Comix</div>

<div class="meBox">
<div>Me</div>

<div class="email">
mybrowncat53@gmail.com
</div>

<div class="sns">
<a href="https://www.behance.net/hibyhanna3e0f" target="_blank">
<img src="images/beh.png">
</a>

<a href="https://www.instagram.com/hanna_something/" target="_blank">
<img src="images/ins.png">
</a>
</div>
</div>

</div>
</div>

<!-- 갤러리 -->
<main class="gallery" id="gallery"></main>

<!-- 썸네일 -->
<aside class="thumbWrap" id="thumbWrap"></aside>

</div>

<!-- 라이트박스 -->
<div id="viewer">
<img id="viewerImg">
</div>

<script>

/* 이미지 순서 */
const files = [
"e1","e2","e3","e4","e5","e6","p25","e7","e8","e13",
"p28","p26","p27","p31","p29","p30",
"e9","e10","e14","e15","e16","e17","e18","e19",
"e20","e21","e22","e23","e24","p32","p33","p34"
];

const gallery=document.getElementById("gallery");
const thumbWrap=document.getElementById("thumbWrap");

const thumbMap={};

/* 이미지 생성 */
files.forEach(name=>{

const img=document.createElement("img");
img.src="images/"+name+".jpg";
img.className="art";
img.id=name;
gallery.appendChild(img);

const num=name.replace(/[a-z]/g,'');
const thumb=document.createElement("img");
thumb.src="images/s"+num+".jpg";
thumb.className="thumb";

thumb.onclick=()=>{
img.scrollIntoView({
behavior:'smooth',
block:'center'
});
};

thumbWrap.appendChild(thumb);
thumbMap[name]=thumb;

/* 🔥 갤러리 마우스 → 썸네일 따라 이동 */
img.addEventListener("mouseenter",()=>{
thumb.scrollIntoView({
behavior:"smooth",
block:"center"
});
});

});

/* 스크롤 등장 */
const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting) e.target.classList.add("show");
});
});

document.querySelectorAll(".art").forEach(img=>{
observer.observe(img);
});

/* 라이트박스 */
const viewer=document.getElementById("viewer");
const viewerImg=document.getElementById("viewerImg");

document.querySelectorAll(".art").forEach(img=>{
img.onclick=()=>{
viewer.style.display="flex";
viewerImg.src=img.src;
};
});

viewer.onclick=()=>viewer.style.display="none";

document.addEventListener("keydown",e=>{
if(e.key==="Escape") viewer.style.display="none";
});

</script>

</body>
</html>
