<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic&display=swap" rel="stylesheet">

<style>

body{
margin:0;
display:flex;
justify-content:center;
font-family:'Playwrite NZ Basic', cursive;
}

/* 전체 레이아웃 */
.wrapper{
display:flex;
width:100%;
max-width:1600px;
}

/* 왼쪽 네비 */
.left-nav{
align-self:center;
margin-right:clamp(20px,5vw,50px);
}

.nav-box{
border:1px solid #999;
padding:8px 20px;
font-size:26px;
white-space:nowrap;
}

/* 갤러리 */
.gallery{
display:flex;
flex-direction:column;
gap:30px;
}

.gallery img{
max-width:700px;
cursor:zoom-in;
}

/* 썸네일 */
.thumbs{
margin-left:clamp(60px,10vw,200px);
height:100vh;
overflow-y:auto;
scrollbar-width:none;
}

.thumbs::-webkit-scrollbar{
display:none;
}

.thumbs img{
width:180px;
display:block;
margin-bottom:10px;
cursor:pointer;
transition:0.3s;
}

.thumbs img:hover{
opacity:0.7;
}

/* 라이트박스 */
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.lightbox img{
max-height:90vh;
max-width:90vw;
}

</style>
</head>

<body>

<div class="wrapper">

<!-- 왼쪽 네비 -->
<div class="left-nav">
<div class="nav-box">Editorial illust</div>
<div class="nav-box">personal works</div>
<div class="nav-box">comics</div>
<div class="nav-box">me</div>
</div>

<!-- 갤러리 -->
<div class="gallery" id="gallery"></div>

<!-- 썸네일 -->
<div class="thumbs" id="thumbs"></div>

</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<script>

const gallery=document.getElementById("gallery");
const thumbs=document.getElementById("thumbs");
const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

/* 이미 존재하는 파일 목록 */
const total=22;

for(let i=1;i<=total;i++){

const filename=`images/e${i}.jpg`;

/* ===== 갤러리 ===== */
const gImg=document.createElement("img");
gImg.src=filename;
gImg.id=`img${i}`;
gallery.appendChild(gImg);

/* 라이트박스 */
gImg.onclick=()=>{
lightbox.style.display="flex";
lightboxImg.src=filename;
};

/* ===== 썸네일 ===== */
const tImg=document.createElement("img");
tImg.src=filename;
thumbs.appendChild(tImg);

/* 썸네일 클릭 → 갤러리 이동 */
tImg.onclick=()=>{
document.getElementById(`img${i}`)
.scrollIntoView({behavior:"smooth",block:"center"});
};

}

/* 라이트박스 닫기 */
lightbox.onclick=()=>lightbox.style.display="none";

document.addEventListener("keydown",e=>{
if(e.key==="Escape") lightbox.style.display="none";
});

</script>

</body>
</html>
