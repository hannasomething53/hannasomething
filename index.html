<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Gallery Layout</title>

<style>

/* =========================
   기본 리셋
========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: sans-serif;
  background: #ffffff;
}


/* =========================
   전체 레이아웃
========================= */
.layout {
  display: grid;
  grid-template-columns: auto 1fr auto;

  /* 반응형 여백 */
  gap: clamp(10px, 2vw, 50px);

  padding: clamp(10px, 2vw, 40px);
  align-items: start;
}


/* =========================
   왼쪽 네비게이션
========================= */
.nav {
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 1vw, 14px);

  /* 갤러리와 50px 기준 반응형 간격 */
  margin-right: clamp(15px, 3vw, 50px);
}

.nav-item {
  background: #d9d9d9;
  padding: clamp(8px, 1vw, 14px) clamp(16px, 2vw, 28px);

  /* 한 줄 유지 + 넓은 폭 */
  white-space: nowrap;
  min-width: max-content;

  border-radius: 4px;
  cursor: pointer;
}


/* =========================
   중앙 갤러리
========================= */
.gallery {
  display: flex;
  flex-direction: column;
  gap: clamp(30px, 4vw, 80px);
}

.gallery img {
  width: 100%;
  height: auto;
  cursor: zoom-in;
}


/* =========================
   오른쪽 썸네일
========================= */
.thumbs {
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 1vw, 16px);

  /* 갤러리와 200px 기준 반응형 간격 */
  margin-left: clamp(40px, 10vw, 200px);
}

.thumbs img {
  width: 90px;
  cursor: pointer;
}


/* =========================
   라이트박스
========================= */
.lightbox {
  position: fixed;
  inset: 0;

  background: rgba(0,0,0,0.85);
  display: none;

  justify-content: center;
  align-items: center;

  /* 이미지가 브라우저에 떠있는 느낌 */
  padding: clamp(20px, 6vh, 80px);
}

.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}

.lightbox.active {
  display: flex;
}

</style>
</head>

<body>

<div class="layout">

  <!-- 왼쪽 네비게이션 -->
  <div class="nav">
    <div class="nav-item">Illustration</div>
    <div class="nav-item">Portrait Work</div>
    <div class="nav-item">Editorial Projects</div>
  </div>


  <!-- 중앙 갤러리 -->
  <div class="gallery">
    <img src="img1.jpg" id="img1">
    <img src="img2.jpg" id="img2">
    <img src="img3.jpg" id="img3">
  </div>


  <!-- 오른쪽 썸네일 -->
  <div class="thumbs">
    <img src="img1.jpg" data-target="img1">
    <img src="img2.jpg" data-target="img2">
    <img src="img3.jpg" data-target="img3">
  </div>

</div>


<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
  <img src="">
</div>


<script>

/* =========================
   썸네일 → 해당 갤러리 위치로 이동
========================= */
document.querySelectorAll('.thumbs img').forEach(thumb => {
  thumb.addEventListener('click', () => {
    const id = thumb.dataset.target;
    document.getElementById(id).scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  });
});


/* =========================
   갤러리 클릭 → 라이트박스
========================= */
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');

document.querySelectorAll('.gallery img').forEach(img => {
  img.addEventListener('click', () => {
    lightboxImg.src = img.src;
    lightbox.classList.add('active');
  });
});


/* 닫기 */
lightbox.addEventListener('click', () => {
  lightbox.classList.remove('active');
});

</script>

</body>
</html>
