<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gallery</title>

<style>

/* 전체 배경 */
body{
margin:0;
background:#faf6e6;
font-family:Arial, sans-serif;
}

/* 전체 3단 구조 */
.wrapper{
display:flex;
justify-content:center;
gap:60px;
padding-top:50px;
}

/* 왼쪽 네비 */
.nav{
position:sticky;
top:40vh;
width:180px;
}

.nav div{
margin:12px 0;
font-size:24px;
cursor:pointer;
}

/* 갤러리 */
.gallery{
width:min(1200px,60vw);
}

.gallery img{
width:100%;
margin:80px 0;
cursor:zoom-in;
opacity:0;
transform:translateY(40px);
transition:.6s;
}

.gallery img.show{
opacity:1;
transform:none;
}

/* 오른쪽 썸네일 */
.thumbs{
position:sticky;
top:50px;
height:90vh;
overflow:hidden;
}

.thumbs img{
display:block;
width:130px;
margin-bottom:10px;
cursor:pointer;
transition:.2s;
}

.thumbs img:hover{
opacity:.7;
}

/* 라이트박스 */
#lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

#lightbox img{
max-height:90vh;
max-width:90vw;
}

</style>
</head>


<body>

<div class="wrapper">

<!-- 왼쪽 네비 -->
<div class="nav">
<div>Editorial illust</div>
<div>Personal works</div>
<div>Comics</div>
<div>Me</div>
</div>


<!-- 갤러리 -->
<div class="gallery" id="gallery"></div>


<!-- 오른쪽 썸네일 -->
<div class="thumbs" id="thumbs"></div>

</div>


<!-- 라이트박스 -->
<div id="lightbox">
<img id="lightbox-img">
</div>



<script>

/* ======================
이미지 순서
====================== */

const order=[
"e1","e2","e3","e4","e5","e6",
"p25",
"e7","e8","e13",
"p28","p26","p27","p31","p29","p30",
"e9","e10","e14","e15","e16","e17",
"e18","e19","e20","e21","e22","e23","e24",
"p32","p33","p34"
];


/* ======================
갤러리 생성
====================== */

const gallery=document.getElementById("gallery");

order.forEach(name=>{
const img=document.createElement("img");
img.src="images/"+name+".jpg";
img.id=name;
gallery.appendChild(img);
});


/* ======================
썸네일 생성
====================== */

const thumbs=document.getElementById("thumbs");

order.forEach(name=>{

const num=name.replace(/[a-z]/g,"");

const img=document.createElement("img");
img.src="images/s"+num+".jpg";

img.onclick=()=>{
document.getElementById(name)
.scrollIntoView({behavior:"smooth",block:"center"});
};

thumbs.appendChild(img);
});


/* ======================
라이트박스
====================== */

const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

document.addEventListener("click",e=>{
if(e.target.closest(".gallery img")){
lightbox.style.display="flex";
lightboxImg.src=e.target.src;
}
});

lightbox.onclick=()=>lightbox.style.display="none";

document.addEventListener("keydown",e=>{
if(e.key==="Escape") lightbox.style.display="none";
});


/* ======================
스크롤 등장 애니메이션
====================== */

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting) entry.target.classList.add("show");
});
},{threshold:0.1});

document.querySelectorAll(".gallery img").forEach(img=>{
observer.observe(img);
});


/* ======================
썸네일 자동 동기화
====================== */

let current=null;
let ticking=false;

function sync(){

let closest=null;
let min=Infinity;

order.forEach(name=>{
const el=document.getElementById(name);
const d=Math.abs(el.getBoundingClientRect().top);
if(d<min){min=d;closest=name;}
});

if(closest===current) return;
current=closest;

const num=closest.replace(/[a-z]/g,"");

const target=[...thumbs.children]
.find(t=>t.src.includes("s"+num));

if(target){
target.scrollIntoView({block:"center"});
}

}

window.addEventListener("scroll",()=>{
if(!ticking){
requestAnimationFrame(()=>{
sync();
ticking=false;
});
ticking=true;
}
},{passive:true});


/* ======================
이미지 우클릭 방지
====================== */

document.addEventListener("contextmenu",e=>{
if(e.target.tagName==="IMG") e.preventDefault();
});

</script>


</body>
</html>
