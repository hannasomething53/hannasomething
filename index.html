<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#fff;
font-family:'Playwrite NZ Basic', sans-serif;
overflow-x:hidden;
}

/* ===== 전체 레이아웃 ===== */

.wrapper{
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:20px;
gap:clamp(10px,5vw,100px);
}

/* ===== 왼쪽 네비 ===== */

.leftNav{
position:sticky;
top:500px;
border-collapse:collapse;
margin-right:0;
}

.leftNav td{
border:1px solid #aaa;
padding:12px 25px;
font-size:24px;
position:relative;
overflow:hidden;
}

.leftNav td::before{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
background:#f2e44d;
z-index:-1;
opacity:0;
transition:0.2s;
}

.leftNav td:hover::before{
opacity:1;
}

/* SNS */

.sns{
display:flex;
gap:10px;
margin-top:10px;
}

.sns img{
width:40px;
height:40px;
cursor:pointer;
}

/* ===== 갤러리 ===== */

.gallery{
width:clamp(500px,50vw,900px);
display:flex;
flex-direction:column;
gap:60px;
}

.gallery img{
width:100%;
cursor:zoom-in;
opacity:0;
transform:translateY(60px);
transition:0.6s;
}

.gallery img.show{
opacity:1;
transform:translateY(0);
}

/* ===== 오른쪽 썸네일 ===== */

.thumbWrap{
position:sticky;
top:20px;
width:180px;
height:90vh;
overflow:hidden;
}

.thumbs{
height:100%;
overflow-y:auto;
scrollbar-width:none;
}

.thumbs::-webkit-scrollbar{
display:none;
}

.thumbs img{
width:180px;
margin-bottom:15px;
cursor:pointer;
transition:0.2s;
}

.thumbs img:hover{
opacity:0.7;
}

/* ===== 라이트박스 ===== */

.lightbox{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.lightbox img{
max-height:90vh;
max-width:90vw;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

</style>
</head>


<body oncontextmenu="return false">

<div class="wrapper">

<!-- 왼쪽 네비 -->
<table class="leftNav">
<tr><td>Editorial illust</td></tr>
<tr><td>personal works</td></tr>
<tr><td>comics</td></tr>
<tr>
<td>
me
<div class="sns">
<a href="https://www.behance.net/hibyhanna3e0f" target="_blank">
<img src="images/beh.png">
</a>
<a href="https://www.instagram.com/hanna_something/" target="_blank">
<img src="images/ins.png">
</a>
</div>
</td>
</tr>
</table>


<!-- 갤러리 -->
<div class="gallery" id="gallery"></div>


<!-- 썸네일 -->
<div class="thumbWrap">
<div class="thumbs" id="thumbs"></div>
</div>

</div>


<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
<img id="lightboxImg">
</div>


<script>

/* ===== 이미지 순서 ===== */

const images=[
"e1","e2","e3","e4","e5","e6",
"p25",
"e7","e8","e13",
"p28","p26","p27","p31","p29","p30",
"e9","e10","e14","e15","e16","e17","e18","e19","e20","e21","e22","e23","e24",
"p32",
"e33","e34"
];

const gallery=document.getElementById("gallery");
const thumbs=document.getElementById("thumbs");

/* ===== 갤러리 생성 ===== */

images.forEach(name=>{

const img=document.createElement("img");
img.src="images/"+name+".jpg";
img.dataset.name=name;
gallery.appendChild(img);

/* 썸네일 */
const num=name.replace(/[a-z]/g,"");
const t=document.createElement("img");
t.src="images/s"+num+".jpg";
t.dataset.target=name;
thumbs.appendChild(t);

});


/* ===== 스크롤 등장 애니메이션 ===== */

const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
e.target.classList.add("show");
}
});
},{threshold:0.2});

document.querySelectorAll(".gallery img").forEach(img=>{
observer.observe(img);
});


/* ===== 라이트박스 ===== */

const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightboxImg");

gallery.addEventListener("click",e=>{
if(e.target.tagName==="IMG"){
lightbox.style.display="flex";
lightboxImg.src=e.target.src;
}
});

lightbox.addEventListener("click",()=>lightbox.style.display="none");

document.addEventListener("keydown",e=>{
if(e.key==="Escape") lightbox.style.display="none";
});


/* ===== 썸네일 클릭 → 갤러리 이동 ===== */

thumbs.addEventListener("click",e=>{
if(e.target.tagName==="IMG"){
const target=document.querySelector(
'[data-name="'+e.target.dataset.target+'"]'
);
target.scrollIntoView({behavior:"smooth",block:"center"});
}
});


/* ===== 스크롤 동기화 ===== */

gallery.addEventListener("scroll",()=>{
thumbs.scrollTop=gallery.scrollTop;
});


</script>

</body>
</html>
