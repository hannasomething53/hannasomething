<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic&display=swap" rel="stylesheet">

<style>

/* 기본 리셋 */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Playwrite NZ Basic', cursive;
}

/* ===== 레이아웃 ===== */

.wrapper{
display:grid;
grid-template-columns:auto 1fr 180px;
gap:clamp(20px,4vw,60px);
padding:clamp(20px,4vw,60px);
}

/* ===== 왼쪽 네비 ===== */

.left-nav{
margin-right:clamp(20px,3vw,50px);
}

.nav-box{
border:1px solid #999;
width:max-content;
}

.nav-item{
padding:10px 20px;
border-bottom:1px solid #999;
font-size:26px;
white-space:nowrap;
}

.nav-item:last-child{
border-bottom:none;
}

/* ===== 중앙 갤러리 ===== */

.gallery{
display:flex;
flex-direction:column;
gap:40px;
}

.gallery img{
width:100%;
max-width:800px;
cursor:zoom-in;
}

/* ===== 오른쪽 썸네일 ===== */

.thumbs{
display:flex;
flex-direction:column;
gap:20px;
margin-left:clamp(60px,8vw,200px);
height:100vh;
overflow-y:auto;
}

/* 스크롤바 숨기기 */
.thumbs::-webkit-scrollbar{
display:none;
}
.thumbs{
scrollbar-width:none;
}

.thumbs img{
width:180px;
cursor:pointer;
transition:.3s;
}

.thumbs img:hover{
opacity:0.7;
}

/* ===== 라이트박스 ===== */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
padding:clamp(20px,6vh,80px);
}

.lightbox img{
max-height:100%;
max-width:100%;
object-fit:contain;
}

</style>
</head>

<body>

<div class="wrapper">

<!-- 왼쪽 -->
<div class="left-nav">
<div class="nav-box">
<div class="nav-item">Editorial illust</div>
<div class="nav-item">personal works</div>
<div class="nav-item">comics</div>
<div class="nav-item">me</div>
</div>
</div>

<!-- 중앙 갤러리 -->
<div class="gallery" id="gallery">

<img src="img1.jpg" id="img1">
<img src="img2.jpg" id="img2">
<img src="img3.jpg" id="img3">

</div>

<!-- 오른쪽 썸네일 -->
<div class="thumbs">

<img src="img1.jpg" data-target="img1">
<img src="img2.jpg" data-target="img2">
<img src="img3.jpg" data-target="img3">

</div>

</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<script>

/* ===== 썸네일 → 갤러리 이동 ===== */

document.querySelectorAll('.thumbs img').forEach(thumb=>{
thumb.onclick=()=>{
document.getElementById(thumb.dataset.target)
.scrollIntoView({behavior:'smooth',block:'center'});
};
});

/* ===== 라이트박스 ===== */

const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightbox-img');

document.querySelectorAll('.gallery img').forEach(img=>{
img.onclick=()=>{
lightbox.style.display='flex';
lightboxImg.src=img.src;
};
});

/* 배경 클릭 닫기 */
lightbox.onclick=()=>{
lightbox.style.display='none';
};

/* ESC 닫기 */
document.addEventListener('keydown',e=>{
if(e.key==='Escape') lightbox.style.display='none';
});

</script>

</body>
</html>
