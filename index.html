<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>hanna_something</title>

  <!-- favicon (탭 아이콘 = home.png) -->
  <link rel="icon" href="images/home.png" />

  <!-- OG (메시지앱 공유 대표 이미지 = 갤러리 첫 이미지) -->
  <meta property="og:title" content="hanna_something" />
  <meta property="og:image" content="images/e1.jpg" />
  <meta property="og:type" content="website" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css?v=20260305_2">
</head>

<body>

  <!-- 모바일 햄버거 -->
  <button class="hamburger" id="hamburger" aria-label="menu">☰</button>

  <!-- 모바일 패널 -->
<div class="mobile-panel" id="mobilePanel" aria-hidden="true">
  <div class="mobile-card" id="mobileCard">
    <div class="mobile-title">Me</div>
    <div class="mobile-email">mybrowncat53@gmail.com</div>

    <div class="mobile-sns">
      <a href="https://www.behance.net/hibyhanna3e0f" target="_blank" rel="noopener">
        <img src="images/linebeh.png" alt="Behance" />
      </a>
      <a href="https://www.instagram.com/hanna_something/" target="_blank" rel="noopener">
        <img src="images/lineins.png" alt="Instagram" />
      </a>
    </div>

    <div class="mobile-comics">
      <button class="mobile-comics-toggle" id="mobileComicsToggle" type="button">
        Comics
      </button>
      <div class="mobile-comics-list" id="mobileComicsList"></div>
    </div>
  </div>
</div>

  <!-- 3열 레이아웃: [카테고리] [갤러리] [썸네일] -->
  <div class="layout" id="layout">

    <!-- LEFT: category -->
    <aside class="category" id="category">
      <div class="home-wrap" id="homeWrap">
        <img src="images/home.png" class="home-btn" id="homeBtn" alt="Home" />
      </div>

      <div class="cat" data-open="e">
        <img src="images/one.png" class="dot" alt="" />
        <span class="cat-text">Editorial illust</span>
      </div>

      <div class="cat" data-open="p">
        <img src="images/one.png" class="dot" alt="" />
        <span class="cat-text nowrap">Personal works</span>
      </div>

      <div class="cat" data-open="comics">
        <img src="images/one.png" class="dot" alt="" />
        <span class="cat-text">Comics</span>
      </div>

      <div class="cat" data-open="me">
        <img src="images/one.png" class="dot" alt="" />
        <span class="cat-text">Me</span>
      </div>

      <div class="email">mybrowncat53@gmail.com</div>

      <div class="sns-wrap">
        <a href="https://www.behance.net/hibyhanna3e0f" target="_blank" rel="noopener">
          <img src="images/linebeh.png" class="sns" alt="Behance" />
        </a>
        <a href="https://www.instagram.com/hanna_something/" target="_blank" rel="noopener">
          <img src="images/lineins.png" class="sns" alt="Instagram" />
        </a>
      </div>
    </aside>

    <!-- CENTER: gallery -->
    <main id="gallery" aria-label="gallery"></main>

    <!-- RIGHT: thumbnails -->
    <aside id="thumbs" aria-label="thumbnails">
      <div class="thumbs-inner" id="thumbsInner"></div>
    </aside>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" aria-hidden="true">
    <img id="lightboxImg" alt="" />
  </div>

  <!-- Category viewer modal (Editorial/Personal) -->
  <div id="categoryModal" aria-hidden="true">
    <div class="cm">
      <button class="cm-close" id="cmClose" aria-label="close">✕</button>

      <!-- 좌/우 클릭 영역(화살표 대신 화면 여백 클릭) -->
      <div class="cm-hit left" id="cmHitLeft" aria-hidden="true"></div>
      <div class="cm-hit right" id="cmHitRight" aria-hidden="true"></div>

      <div class="cm-stage">
        <div class="cm-media">
          <img class="cm-img" id="cmImg" alt="" />
          <div class="cm-caption" id="cmCaption"></div>
        </div>
      </div>

      <!-- 하단 썸네일바(바닥에서 15px 떠있게) -->
      <div class="cm-thumbs" id="cmThumbs" aria-label="modal thumbs"></div>
    </div>
  </div>

  <!-- Comics page (카테고리는 고정, 갤러리+썸네일 영역만 바뀌는 새창 느낌 오버레이) -->
 <!-- Comics page -->
<div id="comicsModal" aria-hidden="true">
  <button class="comics-close" id="comicsClose" aria-label="close">✕</button>

  <div class="comics-inner">
    <div class="comics-list" id="comicsList"></div>
  </div>

  <!-- ✅ 토스트 -->
  <div id="comicsToast" class="comics-toast">
    <img src="images/view.png" alt="view">
  </div>

</div>

  <!-- Book viewer (comics inside) -->
  <div id="bookModal" aria-hidden="true">
    <button class="book-close" id="bookClose" aria-label="close">✕</button>
    <div class="book-hit left" id="bookPrev" aria-hidden="true"></div>
    <div class="book-hit right" id="bookNext" aria-hidden="true"></div>

    <div class="book-stage">
      <img id="bookImg" alt="" />
    </div>
  </div>

  <!-- Me popup -->
  <div id="meModal" aria-hidden="true">
    <div class="me-card">
      <div class="me-titlebar" id="meTitlebar">
  <div class="me-title">Me</div>
  <button class="me-close" id="meClose" aria-label="close">✕</button>
</div>

      <div class="me-scroll">
        <div class="me-wrap" id="meWrap">
          <img src="images/memyme.jpg" id="meImg" alt="me" />

          <!-- 투명 버튼들(퍼센트+비율 기반) -->
          <a class="hot hot-ig" href="https://www.instagram.com/hanna_something/" target="_blank" rel="noopener" aria-label="instagram"></a>
          <a class="hot hot-it" href="https://www.itsnicethat.com/articles/hanna-something-illustration-020920" target="_blank" rel="noopener" aria-label="itsnicethat"></a>
          <a class="hot hot-be" href="https://www.behance.net/hibyhanna3e0f" target="_blank" rel="noopener" aria-label="behance"></a>

          <button class="hot hot-mail" id="copyMail" aria-label="copy email"></button>

          <div class="toast" id="toast">Copied</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
