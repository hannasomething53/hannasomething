<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>

<style>

/* ===== 기본 ===== */
body{
  margin:0;
  font-family:Arial, sans-serif;
  display:flex;
  background:#eef2f3;
}

/* ===== 왼쪽 네비 ===== */
.sidebar{
  width:400px;
  height:100vh;
  background:#d9d9d9;
  padding:60px 40px;
  box-sizing:border-box;
  position:sticky;
  top:0;

  /* 슬라이드 등장 */
  transform:translateX(100%);
  animation:slideIn 0.6s ease forwards;
}

@keyframes slideIn{
  to{ transform:translateX(0); }
}

.sidebar h3{
  margin:0 0 20px;
  font-weight:500;
}

.sidebar p{
  margin:12px 0;
  cursor:pointer;
}

/* ===== 오른쪽 영역 ===== */
.gallery{
  flex:1;
  padding:40px;
}

/* ===== 이미지 그리드 ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(900px,1fr));
  gap:40px;
}

/* 이미지 */
.grid img{
  width:100%;
  height:auto;
  display:block;
  cursor:pointer;
}

/* ===== 라이트박스 ===== */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#lightbox img{
  max-width:min(1200px, 95vw);
  max-height:95vh;
}

</style>
</head>


<body>

<!-- 왼쪽 네비 -->
<div class="sidebar">
  <h3>Menu</h3>
  <p>Editorial illust</p>
  <p>Personal works</p>
  <p>Narrative / comics</p>
  <p>Me</p>
</div>


<!-- 오른쪽 이미지 -->
<div class="gallery">
  <div class="grid" id="grid"></div>
</div>


<!-- 라이트박스 -->
<div id="lightbox">
  <img id="lightbox-img">
</div>



<script>

/* ===== 이미지 자동 생성 e1 ~ e22 ===== */

const grid = document.getElementById("grid");

for(let i=1;i<=22;i++){
  const img=document.createElement("img");
  img.src=`images/e${i}.jpg`;
  img.alt=`e${i}`;
  grid.appendChild(img);
}


/* ===== 라이트박스 ===== */

const lightbox=document.getElementById("lightbox");
const lightImg=document.getElementById("lightbox-img");

document.addEventListener("click", e=>{
  if(e.target.matches(".grid img")){
    lightbox.style.display="flex";
    lightImg.src=e.target.src;
  }
});

lightbox.onclick=()=>{
  lightbox.style.display="none";
};

</script>

</body>
</html>
